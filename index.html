<!DOCTYPE html>

    <style>

  <body>

    <script>
      const LICENSE_KEY = "c6b7960392f450591698aeff6312f19386650d91c7385a4a2f97f6b62343c2f73ff6f012af5d9fbf";
      const genres = {
        indie: {
          label: "Indie",
          effects: ["indie1.deepar", "indie2.deepar", "indie3.deepar"],
          thumbs: [
            "assets/ui/thumbs/indie-1.png",
            "assets/ui/thumbs/indie-2.png",
            "assets/ui/thumbs/indie-3.png"
          ]
        },
        poppunk: {
          label: "Pop Punk",
          effects: ["poppunk1.deepar", "poppunk2.deepar", "poppunk3.deepar"],
          thumbs: [
            "assets/ui/thumbs/poppunk-1.png",
            "assets/ui/thumbs/poppunk-2.png",
            "assets/ui/thumbs/poppunk-3.png"
          ]
        },
        rnb: {
          label: "RNB",
          effects: ["rnb1.deepar", "rnb2.deepar", "rnb3.deepar"],
          thumbs: [
            "assets/ui/thumbs/rnb-1.png",
            "assets/ui/thumbs/rnb-2.png",
            "assets/ui/thumbs/rnb-3.png"
          ]
        }
      };

      const landingEl = document.getElementById("landing");
      const experienceEl = document.getElementById("experience");
      const deeparDiv = document.getElementById("deepar-div");
      const statusEl = document.getElementById("status");
      const uiLayer = document.getElementById("ui-layer");
      const faceGuide = document.getElementById("face-guide");
      const chooseLabel = document.getElementById("choose-label");
      const variantsEl = document.getElementById("variants");
      const genreTabs = document.getElementById("genre-tabs");
      const tooltip = document.getElementById("tooltip");
      const capturePanel = document.getElementById("capture-panel");
      const downloadPopup = document.getElementById("download-popup");
      const capturePreview = document.getElementById("capture-preview");
      const captureCountdown = document.getElementById("capture-countdown");
      const captureCountNum = document.getElementById("capture-count-num");

      let deepAR = null;
      let capturedDataUrl = null;
      let activeGenre = null;
      let activeVariant = 0;
      let cameraFacing = "user";
      let switchingCamera = false;
      let switchingEffect = false;

      async function startFacingCamera(facing) {
        const options = {
          mirror: facing === "user",
          mediaStreamConstraints: {
            audio: false,
            video: { facingMode: { ideal: facing } }
          }
        };
        try {
          await deepAR.startCamera(options);
        } catch (error) {
          await deepAR.startCamera({
            mirror: facing === "user",
            mediaStreamConstraints: {
              audio: false,
              video: { facingMode: { exact: facing } }
            }
          });
        }
        cameraFacing = facing;
      }

      async function flipCamera() {
        if (!deepAR || switchingCamera) return;
        switchingCamera = true;
        const nextFacing = cameraFacing === "user" ? "environment" : "user";
        try {
          deepAR.stopCamera();
          await startFacingCamera(nextFacing);
        } catch (error) {
          console.error(error);
          try {
            deepAR.stopCamera();
            await startFacingCamera(cameraFacing);
          } catch (retryError) {
            console.error(retryError);
          }
        } finally {
          switchingCamera = false;
        }
      }

      function setTooltipVisible(visible) {
        tooltip.hidden = !visible;
      }

      function setVariantLoading(button, loading) {
        variantsEl.querySelectorAll(".variant-btn").forEach((el) => {
          el.disabled = loading;
          if (loading) {
            el.classList.toggle("loading", el === button);
          } else {
            el.classList.remove("loading");
          }
        });
      }

      async function applyEffect(effect, button) {
        if (!deepAR || switchingEffect) return;
        switchingEffect = true;
        setVariantLoading(button, true);
        try {
          await deepAR.switchEffect(effect);
        } catch (error) {
          console.error(error);
        } finally {
          switchingEffect = false;
          setVariantLoading(null, false);
        }
      }

      function renderVariants(genreKey) {
        const genre = genres[genreKey];
        variantsEl.innerHTML = "";
        genre.effects.forEach((effect, index) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "variant-btn" + (index === activeVariant ? " selected" : "");
          button.innerHTML =
            '<img class="ring" src="assets/ui/ring.svg" alt="" />' +
            '<img class="thumb" src="' + genre.thumbs[index] + '" alt="Look ' + (index + 1) + '" />' +
            '<span class="variant-spinner" aria-hidden="true"></span>';
          button.addEventListener("click", async () => {
            if (activeVariant === index || switchingEffect) return;
            activeVariant = index;
            variantsEl.querySelectorAll(".variant-btn").forEach((el) => el.classList.remove("selected"));
            button.classList.add("selected");
            await applyEffect(effect, button);
          });
          variantsEl.appendChild(button);
        });
      }

      function showCaptureActions(visible) {
        capturePanel.hidden = !visible;
        uiLayer.classList.toggle("with-capture", visible);
      }

      function setCapturingMode(active) {
        experienceEl.classList.toggle("experience-capturing", active);
      }

      function openDownloadPopup(dataUrl) {
        capturedDataUrl = dataUrl;
        capturePreview.src = dataUrl;
        deeparDiv.style.visibility = "hidden";
        downloadPopup.hidden = false;
      }

      function closeDownloadPopup() {
        downloadPopup.hidden = true;
        capturePreview.removeAttribute("src");
        capturedDataUrl = null;
        deeparDiv.style.visibility = "";
        setCapturingMode(false);
      }

      function saveCapturedImage() {
        if (!capturedDataUrl) return;
        const link = document.createElement("a");
        link.href = capturedDataUrl;
        link.download = "amild-one-" + Date.now() + ".png";
        document.body.appendChild(link);
        link.click();
        link.remove();
      }

      function waitMs(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
      }

      async function runCaptureCountdown() {
        captureCountdown.hidden = false;
        for (const value of [3, 2, 1]) {
          captureCountNum.textContent = String(value);
          captureCountNum.style.animation = "none";
          void captureCountNum.offsetWidth;
          captureCountNum.style.animation = "";
          await waitMs(1000);
        }
        captureCountdown.hidden = true;
        captureCountNum.textContent = "";
      }

      async function capturePhoto() {
        if (!deepAR || typeof deepAR.takeScreenshot !== "function") return;
        const captureBtn = document.getElementById("btn-capture");
        captureBtn.disabled = true;
        setCapturingMode(true);
        try {
          await runCaptureCountdown();
          const dataUrl = await deepAR.takeScreenshot();
          openDownloadPopup(dataUrl);
        } catch (error) {
          console.error(error);
          captureCountdown.hidden = true;
          captureCountNum.textContent = "";
          setCapturingMode(false);
        } finally {
          captureBtn.disabled = false;
        }
      }

      async function selectGenre(genreKey) {
        if (activeGenre === genreKey && !switchingEffect) return;
        activeGenre = genreKey;
        activeVariant = 0;
        faceGuide.hidden = true;
        chooseLabel.hidden = false;
        variantsEl.hidden = false;
        showCaptureActions(true);
        setTooltipVisible(false);
        renderVariants(genreKey);
        genreTabs.querySelectorAll(".genre-tab").forEach((tab) => {
          tab.classList.toggle("selected", tab.dataset.genre === genreKey);
        });
        const firstButton = variantsEl.querySelector(".variant-btn");
        await applyEffect(genres[genreKey].effects[0], firstButton);
      }

      genreTabs.querySelectorAll(".genre-tab").forEach((tab) => {
        tab.addEventListener("click", () => {
          selectGenre(tab.dataset.genre);
        });
      });

      document.getElementById("tooltip-dismiss").addEventListener("click", () => setTooltipVisible(false));

      document.getElementById("btn-capture").addEventListener("click", capturePhoto);
      document.getElementById("btn-download-popup").addEventListener("click", saveCapturedImage);
      document.getElementById("btn-popup-retake").addEventListener("click", closeDownloadPopup);

      document.getElementById("btn-flip").addEventListener("click", flipCamera);

      document.getElementById("start-btn").addEventListener("click", async () => {
        landingEl.hidden = true;
        experienceEl.hidden = false;
        try {
          deepAR = await deepar.initialize({
            licenseKey: LICENSE_KEY,
            previewElement: document.getElementById("deepar-div")
          });
        } catch (error) {
          console.error(error);
          statusEl.textContent =
            "Kamera atau license ditolak. Pastikan situs dibuka lewat HTTPS, domain terdaftar di DeepAR, lalu izinkan kamera.";
          return;
        }

        statusEl.hidden = true;
        uiLayer.hidden = false;
        genreTabs.hidden = false;
        setTooltipVisible(true);
      });
    </script>
  </body>
</html>
